<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Platform Login</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <div style="min-height: 100vh; display: flex; align-items: center; justify-content: center;">
        <div style="max-width: 400px; width: 100%; background: var(--bg-panel); border-radius: 16px; padding: 40px; border: 1px solid var(--line); box-shadow: var(--shadow);">
            <div style="text-align: center; margin-bottom: 30px;">
                <div class="brand-mark" style="margin: 0 auto 15px auto;">R</div>
                <h2 style="margin: 0;">Moderator Portal</h2>
            </div>
            
            <form method="POST" action="{{ url_for('login') }}">
                <div>
                    <label style="color: var(--text-main); font-weight: 600; margin-bottom: 8px; display: block; font-size: 14px;">Email Address</label>
                    <input type="email" name="email" required placeholder="moderator@ecommerce.com">
                </div>
                <div>
                    <label style="color: var(--text-main); font-weight: 600; margin-bottom: 8px; display: block; font-size: 14px;">Password</label>
                    <input type="password" name="password" required placeholder="••••••••">
                </div>
                <button type="submit" class="primary-btn">Sign In</button>
            </form>
            <div style="text-align: center; margin-top: 20px; font-size: 13px; color: var(--text-muted);">
                Demo mode active. No password required.
            </div>
        </div>
    </div>
</body>
</html>
