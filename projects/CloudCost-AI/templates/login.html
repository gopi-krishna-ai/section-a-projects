<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CloudCost AI - Login</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <div style="min-height: 100vh; display: flex; align-items: center; justify-content: center;">
        <div style="max-width: 400px; width: 100%; background: var(--panel-bg); backdrop-filter: blur(15px); border-radius: 16px; padding: 40px; border: 1px solid var(--line);">
            <div style="text-align: center; margin-bottom: 30px;">
                <div class="brand-mark" style="margin: 0 auto 15px auto;">AI</div>
                <h2 style="margin: 0;">Enterprise Login</h2>
            </div>
            
            <form method="POST" action="{{ url_for('login') }}">
                <div style="margin-bottom: 20px;">
                    <label style="color: var(--muted); margin-bottom: 5px; display: block; font-size: 13px;">Corporate Email</label>
                    <input type="email" name="email" required placeholder="admin@enterprise.com">
                </div>
                <div style="margin-bottom: 30px;">
                    <label style="color: var(--muted); margin-bottom: 5px; display: block; font-size: 13px;">Password</label>
                    <input type="password" name="password" required placeholder="••••••••">
                </div>
                <button type="submit" class="primary-btn">Sign In to Console</button>
            </form>
            <div style="text-align: center; margin-top: 20px; font-size: 12px; color: var(--muted);">
                Demo Mode: Any credentials will work.
            </div>
        </div>
    </div>
</body>
</html>
