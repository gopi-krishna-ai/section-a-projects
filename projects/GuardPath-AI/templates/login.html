<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GuardPath AI - Login</title>
<link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">

</head>
<body>

<header class="topbar">
    <div class="brand">
        <img src="{{ url_for('static', filename='images/logo.jpg') }}" class="brand-icon" alt="GuardPath Logo">
        <div>
            <h1>GuardPath</h1>
            <p class="tagline">AI-Powered Personal Safety &amp; Smart Route Planner</p>
        </div>
    </div>
</header>

<main class="container">
    <section class="panel" style="max-width: 450px; margin: 50px auto;">
        <h2 style="text-align:center;">Login</h2>
        {% with messages = get_flashed_messages() %}
          {% if messages %}
            {% for message in messages %}
              <div class="alert">{{ message }}</div>
            {% endfor %}
          {% endif %}
        {% endwith %}
        <form method="POST" action="{{ url_for('login') }}">
            <div class="field" style="margin-bottom: 20px;">
                <label for="username">Username</label>
                <input type="text" id="username" name="username" required>
            </div>
            <div class="field" style="margin-bottom: 25px;">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" required>
            </div>
            <button type="submit" class="submit-btn">Sign In</button>
        </form>
        
        <div style="text-align: center; margin-top: 20px; font-weight: 500;">
            <a href="{{ url_for('register') }}" style="color: var(--accent); text-decoration: none;">Don't have an account? Register here.</a>
        </div>
        
    </section>
</main>

</body>
</html>
