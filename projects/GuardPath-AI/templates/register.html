<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GuardPath AI - Register</title>
<link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>

<header class="topbar">
    <div class="brand">
        <img src="{{ url_for('static', filename='images/logo.jpg') }}" class="brand-icon" alt="GuardPath Logo">
        <div>
            <h1>GuardPath</h1>
            <p class="tagline">AI-Powered Personal Safety &amp; Smart Route Planner</p>
        </div>
    </div>
    <div style="color:white; margin-right:20px;">
        <a href="{{ url_for('login') }}" style="color:white; text-decoration:none; font-weight:600;">Back to Login</a>
    </div>
</header>

<main class="container">
    <section class="panel" style="max-width: 500px; margin: 40px auto;">
        <h2 style="text-align:center;">Create an Account</h2>
        {% with messages = get_flashed_messages() %}
          {% if messages %}
            {% for message in messages %}
              <div class="alert" style="background: #fef3c7; border: 1px solid #fbbf24; color: #92400e;">{{ message }}</div>
            {% endfor %}
          {% endif %}
        {% endwith %}
        <form method="POST" action="{{ url_for('register') }}">
            <div class="field" style="margin-bottom: 20px;">
                <label for="name">Full Name</label>
                <input type="text" id="name" name="name" required placeholder="John Doe">
            </div>
            <div class="field" style="margin-bottom: 20px;">
                <label for="email">Your Email Address</label>
                <input type="email" id="email" name="email" required placeholder="john@example.com">
            </div>
            <div class="field" style="margin-bottom: 20px;">
                <label for="username">Choose a Username</label>
                <input type="text" id="username" name="username" required placeholder="johndoe123">
            </div>
            <div class="field" style="margin-bottom: 30px;">
                <label for="password">Choose a Password</label>
                <input type="password" id="password" name="password" required>
            </div>
            <button type="submit" class="submit-btn">Register Account</button>
        </form>
        <div style="text-align: center; margin-top: 20px; font-weight: 500;">
            <a href="{{ url_for('login') }}" style="color: var(--accent); text-decoration: none;">Already have an account? Log in here.</a>
        </div>
    </section>
</main>

</body>
</html>
