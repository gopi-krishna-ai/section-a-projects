{% extends "base.html" %}

{% block content %}
<div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
    <div class="md:flex md:items-center md:justify-between mb-8">
        <div class="flex-1 min-w-0">
            <h2 class="text-2xl font-bold leading-7 text-gray-900 sm:text-3xl sm:truncate">
                Welcome back, {{ current_user.username }}
            </h2>
        </div>
        <div class="mt-4 flex md:mt-0 md:ml-4">
            <a href="{{ url_for('citizen.new_application', service_type='PAN') }}" class="ml-3 inline-flex items-center px-4 py-2 border border-transparent rounded-md shadow-sm text-sm font-medium text-white bg-blue-600 hover:bg-blue-700 focus:outline-none">
                Start New Application
            </a>
        </div>
    </div>

    <!-- Stats -->
    <dl class="mt-5 grid grid-cols-1 gap-5 sm:grid-cols-2 lg:grid-cols-4">
        <div class="relative bg-white pt-5 px-4 pb-12 sm:pt-6 sm:px-6 shadow rounded-lg overflow-hidden border border-gray-100">
            <dt>
                <div class="absolute bg-blue-500 rounded-md p-3">
                    <i class="fa-solid fa-file-signature text-white h-6 w-6 text-center"></i>
                </div>
                <p class="ml-16 text-sm font-medium text-gray-500 truncate">Applications Started</p>
            </dt>
            <dd class="ml-16 pb-6 flex items-baseline sm:pb-7">
                <p class="text-2xl font-semibold text-gray-900">0</p>
            </dd>
        </div>
        <div class="relative bg-white pt-5 px-4 pb-12 sm:pt-6 sm:px-6 shadow rounded-lg overflow-hidden border border-gray-100">
            <dt>
                <div class="absolute bg-green-500 rounded-md p-3">
                    <i class="fa-solid fa-check text-white h-6 w-6 text-center"></i>
                </div>
                <p class="ml-16 text-sm font-medium text-gray-500 truncate">Completed</p>
            </dt>
            <dd class="ml-16 pb-6 flex items-baseline sm:pb-7">
                <p class="text-2xl font-semibold text-gray-900">0</p>
            </dd>
        </div>
        <div class="relative bg-white pt-5 px-4 pb-12 sm:pt-6 sm:px-6 shadow rounded-lg overflow-hidden border border-gray-100">
            <dt>
                <div class="absolute bg-yellow-500 rounded-md p-3">
                    <i class="fa-solid fa-clock text-white h-6 w-6 text-center"></i>
                </div>
                <p class="ml-16 text-sm font-medium text-gray-500 truncate">Pending Review</p>
            </dt>
            <dd class="ml-16 pb-6 flex items-baseline sm:pb-7">
                <p class="text-2xl font-semibold text-gray-900">0</p>
            </dd>
        </div>
        <div class="relative bg-white pt-5 px-4 pb-12 sm:pt-6 sm:px-6 shadow rounded-lg overflow-hidden border border-gray-100">
            <dt>
                <div class="absolute bg-red-500 rounded-md p-3">
                    <i class="fa-solid fa-triangle-exclamation text-white h-6 w-6 text-center"></i>
                </div>
                <p class="ml-16 text-sm font-medium text-gray-500 truncate">Needs Attention</p>
            </dt>
            <dd class="ml-16 pb-6 flex items-baseline sm:pb-7">
                <p class="text-2xl font-semibold text-gray-900">0</p>
            </dd>
        </div>
    </dl>

    <!-- My Applications -->
    <div class="mt-8">
        <h3 class="text-lg leading-6 font-medium text-gray-900 mb-4">My Applications</h3>
        <div class="bg-white shadow overflow-hidden sm:rounded-md border border-gray-100">
            <ul role="list" class="divide-y divide-gray-200">
                <li class="px-4 py-8 text-center text-gray-500">
                    No applications started yet. Click "Start New Application" to begin.
                </li>
            </ul>
        </div>
    </div>
</div>
{% endblock %}
