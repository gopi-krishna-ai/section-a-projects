{% extends "base.html" %}

{% block content %}
<div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
    <div class="md:flex md:items-center md:justify-between mb-8">
        <div class="flex-1 min-w-0">
            <h2 class="text-2xl font-bold leading-7 text-gray-900 sm:text-3xl sm:truncate">
                Admin Dashboard
            </h2>
        </div>
    </div>

    <!-- Stats -->
    <dl class="mt-5 grid grid-cols-1 gap-5 sm:grid-cols-3">
        <div class="bg-white overflow-hidden shadow rounded-lg border border-gray-100">
            <div class="px-4 py-5 sm:p-6 text-center">
                <dt class="text-sm font-medium text-gray-500 truncate">Total Applications</dt>
                <dd class="mt-1 text-3xl font-semibold text-gray-900">0</dd>
            </div>
        </div>
        <div class="bg-white overflow-hidden shadow rounded-lg border border-gray-100">
            <div class="px-4 py-5 sm:p-6 text-center">
                <dt class="text-sm font-medium text-gray-500 truncate">Pending Review</dt>
                <dd class="mt-1 text-3xl font-semibold text-yellow-600">0</dd>
            </div>
        </div>
        <div class="bg-white overflow-hidden shadow rounded-lg border border-gray-100">
            <div class="px-4 py-5 sm:p-6 text-center">
                <dt class="text-sm font-medium text-gray-500 truncate">Needs Correction</dt>
                <dd class="mt-1 text-3xl font-semibold text-red-600">0</dd>
            </div>
        </div>
    </dl>

    <!-- Recent Activity -->
    <div class="mt-8 flex gap-8">
        <div class="w-2/3">
            <h3 class="text-lg leading-6 font-medium text-gray-900 mb-4">Applications Pending Review</h3>
            <div class="bg-white shadow overflow-hidden sm:rounded-md border border-gray-100">
                <ul role="list" class="divide-y divide-gray-200">
                    <li class="px-4 py-8 text-center text-gray-500">
                        No applications pending review at this time.
                    </li>
                </ul>
            </div>
        </div>
        
        <div class="w-1/3">
             <h3 class="text-lg leading-6 font-medium text-gray-900 mb-4">System Alerts</h3>
             <div class="bg-white shadow sm:rounded-md border border-gray-100 p-4">
                 <p class="text-sm text-gray-500">System operating normally.</p>
             </div>
        </div>
    </div>
</div>
{% endblock %}
