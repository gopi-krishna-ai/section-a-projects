<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ResQAI - Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body class="d-flex align-items-center justify-content-center">

    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-5">
                <div class="card glass-card p-4">
                    <div class="text-center mb-4">
                        <h2 class="fw-bold text-danger"><i class="fa-solid fa-house-tsunami me-2"></i>ResQAI</h2>
                        <p class="text-muted">Command Center Login</p>
                    </div>

                    {% with messages = get_flashed_messages(with_categories=true) %}
                      {% if messages %}
                        {% for category, message in messages %}
                          <div class="alert alert-{{ category }}">{{ message }}</div>
                        {% endfor %}
                      {% endif %}
                    {% endwith %}

                    <form method="POST" action="/login">
                        <div class="mb-3">
                            <label class="form-label fw-bold">Email address</label>
                            <input type="email" name="email" class="form-control" required placeholder="admin@resqai.org">
                        </div>
                        <div class="mb-4">
                            <label class="form-label fw-bold">Password</label>
                            <input type="password" name="password" class="form-control" required placeholder="********">
                        </div>
                        <button type="submit" class="btn btn-primary w-100 fw-bold mb-3">Login to Dashboard</button>
                    </form>

                    <div class="text-center">
                        <p class="mb-0 text-muted">Don't have an account? <a href="/register" class="fw-bold text-decoration-none">Register here</a></p>
                    </div>
                </div>
            </div>
        </div>
    </div>

</body>
</html>
