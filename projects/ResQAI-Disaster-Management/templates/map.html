<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ResQAI - Global Disaster Map</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="/static/css/style.css">
    <style>
        #map {
            height: 600px;
            width: 100%;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            cursor: default;
        }
        .reporting-mode #map {
            cursor: crosshair;
        }
        .controls-container {
            background: rgba(255, 255, 255, 0.95);
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            margin-bottom: 20px;
        }
        .leaflet-popup-content-wrapper {
            background: #1e293b;
            color: #f8fafc;
        }
        .leaflet-popup-tip {
            background: #1e293b;
        }
    </style>
</head>
<body>

    <nav class="navbar navbar-expand-lg navbar-light glass-nav">
        <div class="container-fluid">
            <a class="navbar-brand fw-bold text-danger" href="/">
                <i class="fa-solid fa-house-tsunami me-2"></i>ResQAI
            </a>
            <div class="collapse navbar-collapse">
                <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                    <li class="nav-item">
                        <a class="nav-link fw-bold text-secondary" href="/dashboard">Dashboard</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link fw-bold text-secondary" href="/assistant"><i class="fa-solid fa-robot me-1"></i> Web Assistant</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link active text-primary fw-bold" href="/map"><i class="fa-solid fa-earth-americas me-1"></i> Global Map</a>
                    </li>
                </ul>
            </div>
            <div class="d-flex ms-auto">
                <a href="/logout" class="btn btn-outline-danger btn-sm fw-bold">Logout</a>
            </div>
        </div>
    </nav>

    <div class="container mt-4 mb-5" id="mainContainer">
        <div class="row">
            <div class="col-md-12">
                <div class="controls-container d-flex align-items-center justify-content-between">
                    <div>
                        <h4 class="fw-bold mb-1 text-dark"><i class="fa-solid fa-map-location-dot text-danger me-2"></i> Disaster Map & Live Reporting</h4>
                        <p class="text-muted mb-0" style="font-size:14px;">Select a year to view catastrophes, or toggle Report Mode to mark a 5km incident radius.</p>
                    </div>
                    <div class="d-flex align-items-center gap-3">
                        <button id="toggleReportBtn" class="btn btn-outline-danger fw-bold"><i class="fa-solid fa-crosshairs me-1"></i> Enable Reporting</button>
                        <div>
                            <label for="yearSelect" class="fw-bold me-2 text-dark">Filter Year:</label>
                            <select id="yearSelect" class="form-select d-inline-block fw-bold text-primary" style="width: 120px;">
                                <option value="All">All</option>
                                <option value="2026">2026</option>
                                <option value="2023">2023</option>
                                <option value="2015">2015</option>
                                <option value="2011">2011</option>
                                <option value="2010">2010</option>
                                <option value="2008">2008</option>
                                <option value="2005">2005</option>
                                <option value="2004">2004</option>
                            </select>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div class="row">
            <div class="col-md-12">
                <div id="map"></div>
            </div>
        </div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map').setView([20, 0], 2);
        L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png', {
            attribution: '&copy; OpenStreetMap',
            subdomains: 'abcd',
            maxZoom: 20
        }).addTo(map);

        let currentLayer = L.layerGroup().addTo(map);
        let reportingMode = false;
        let tempMarker = null;
        let allDisasters = [];

        function loadDisasters() {
            fetch('/api/disasters')
                .then(res => res.json())
                .then(data => {
                    allDisasters = data;
                    renderDisasters(document.getElementById('yearSelect').value);
                });
        }

        function renderDisasters(filterYear) {
            currentLayer.clearLayers();
            
            allDisasters.forEach(d => {
                if (filterYear === 'All' || d.year == filterYear) {
                    // Check if it's a new report (5km radius representation)
                    // If deaths are small, scale is small. 
                    let isNewReport = d.year == new Date().getFullYear();
                    
                    let radiusPixels = Math.max(8, Math.min(30, Math.sqrt(d.deaths) / 10));
                    
                    if (isNewReport) {
                        // Draw a physical 5km radius on the map
                        let radiusCircle = L.circle([d.lat, d.lng], {
                            radius: 5000, // 5km in meters
                            color: '#ef4444',
                            fillColor: '#fca5a5',
                            fillOpacity: 0.5,
                            weight: 2
                        }).addTo(currentLayer);
                        bindDisasterPopup(radiusCircle, d);
                    } else {
                        // Historical visual dots
                        let circle = L.circleMarker([d.lat, d.lng], {
                            radius: radiusPixels,
                            fillColor: "#dc3545",
                            color: "#dc3545",
                            weight: 2,
                            opacity: 0.8,
                            fillOpacity: 0.5
                        });
                        bindDisasterPopup(circle, d);
                        currentLayer.addLayer(circle);
                    }
                }
            });
        }
        
        function bindDisasterPopup(marker, d) {
            const popupContent = `
                <div style="font-family: Arial, sans-serif; min-width: 200px;">
                    <h6 style="color:#f87171; margin-bottom:5px; font-weight:bold;"><i class="fa-solid fa-triangle-exclamation"></i> ${d.type} (${d.year})</h6>
                    <hr style="margin:5px 0; border-color:#475569;">
                    <b>Location:</b> ${d.country}<br>
                    <b>Casualties:</b> <span style="color:#ef4444; font-weight:bold;">${d.deaths.toLocaleString()}</span><br>
                    <p style="margin-top:8px; font-size:12px; line-height:1.4;">${d.desc}</p>
                </div>
            `;
            marker.bindPopup(popupContent);
        }

        // Toggle Reporting Mode
        const toggleBtn = document.getElementById('toggleReportBtn');
        toggleBtn.addEventListener('click', () => {
            reportingMode = !reportingMode;
            if(reportingMode) {
                document.getElementById('mainContainer').classList.add('reporting-mode');
                toggleBtn.classList.replace('btn-outline-danger', 'btn-danger');
                toggleBtn.innerHTML = '<i class="fa-solid fa-crosshairs me-1"></i> Tap Map to Report';
            } else {
                document.getElementById('mainContainer').classList.remove('reporting-mode');
                toggleBtn.classList.replace('btn-danger', 'btn-outline-danger');
                toggleBtn.innerHTML = '<i class="fa-solid fa-crosshairs me-1"></i> Enable Reporting';
                if(tempMarker) map.removeLayer(tempMarker);
            }
        });

        // Map Click Event
        map.on('click', function(e) {
            if(!reportingMode) return;
            
            if(tempMarker) map.removeLayer(tempMarker);
            
            // Draw a temporary 5km radius marker
            tempMarker = L.circle(e.latlng, {
                radius: 5000, 
                color: '#f59e0b', 
                fillColor: '#fcd34d',
                fillOpacity: 0.6,
                weight: 2
            }).addTo(map);
            
            const formHtml = `
                <div style="color:black; min-width:220px;">
                    <h6 class="fw-bold text-danger"><i class="fa-solid fa-bullhorn"></i> Report Incident (5km Radius)</h6>
                    <input type="text" id="repType" placeholder="Disaster Type (e.g. Flood)" class="form-control form-control-sm mb-2" style="background:#fff;color:#000;">
                    <input type="text" id="repLocation" placeholder="Country / Region" class="form-control form-control-sm mb-2" style="background:#fff;color:#000;">
                    <input type="number" id="repDeaths" placeholder="Est. Casualties" class="form-control form-control-sm mb-2" style="background:#fff;color:#000;">
                    <textarea id="repDesc" placeholder="Brief Description" class="form-control form-control-sm mb-2" rows="2" style="background:#fff;color:#000;"></textarea>
                    <button onclick="submitReport(${e.latlng.lat}, ${e.latlng.lng})" class="btn btn-sm btn-danger w-100 fw-bold">Submit to Global DB</button>
                </div>
            `;
            
            // Note: For custom popup coloring on the form, we override leaflet classes briefly, but standard bootstrap works.
            tempMarker.bindPopup(formHtml, {className: 'custom-form-popup'}).openPopup();
        });

        // Add this to window so the onclick in popup works
        window.submitReport = function(lat, lng) {
            const type = document.getElementById('repType').value;
            const country = document.getElementById('repLocation').value;
            const deaths = document.getElementById('repDeaths').value;
            const desc = document.getElementById('repDesc').value;
            
            if(!type || !country) {
                alert("Please fill out Type and Location.");
                return;
            }

            fetch('/api/disasters', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({
                    lat: lat,
                    lng: lng,
                    type: type,
                    country: country,
                    deaths: deaths || 0,
                    desc: desc
                })
            })
            .then(res => res.json())
            .then(data => {
                map.closePopup();
                if(tempMarker) map.removeLayer(tempMarker);
                
                // Turn off reporting mode automatically
                toggleBtn.click(); 
                
                // Refresh data
                loadDisasters();
                alert("Incident broadcasted to Global Database!");
            })
            .catch(err => alert("Error reporting incident."));
        }

        document.getElementById('yearSelect').addEventListener('change', (e) => {
            renderDisasters(e.target.value);
        });

        // Init
        loadDisasters();

    </script>
</body>
</html>
