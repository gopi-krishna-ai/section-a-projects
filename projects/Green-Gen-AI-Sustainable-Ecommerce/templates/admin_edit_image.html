{% extends "base.html" %}

{% block content %}
<div class="max-w-3xl mx-auto py-10 px-4 sm:px-6 lg:px-8">
    <div class="bg-white shadow overflow-hidden sm:rounded-lg">
        <div class="px-4 py-5 border-b border-gray-200 sm:px-6 flex justify-between items-center">
            <div>
                <h3 class="text-lg leading-6 font-medium text-gray-900">
                    Edit Product Image
                </h3>
                <p class="mt-1 max-w-2xl text-sm text-gray-500">
                    Update the image for {{ product.name }} (ID: {{ product.id }})
                </p>
            </div>
            <a href="{{ url_for('admin_dashboard') }}" class="text-sm font-medium text-gray-500 hover:text-gray-700">Back to Dashboard</a>
        </div>
        
        <div class="px-4 py-5 sm:p-6 flex flex-col md:flex-row gap-8">
            <div class="flex-shrink-0">
                <p class="text-sm font-medium text-gray-700 mb-2">Current Image</p>
                <img src="{{ product.image_url }}" alt="{{ product.name }}" class="h-48 w-48 object-cover rounded-lg shadow-md border border-gray-200">
            </div>
            
            <div class="flex-grow">
                <form action="{{ url_for('admin_edit_image', product_id=product.id) }}" method="POST" enctype="multipart/form-data" class="space-y-6">
                    
                    <!-- Option 1: Upload new image -->
                    <div>
                        <label class="block text-sm font-medium text-gray-700">Upload New File</label>
                        <div class="mt-1 flex justify-center px-6 pt-5 pb-6 border-2 border-gray-300 border-dashed rounded-md hover:border-green-500 transition-colors">
                            <div class="space-y-1 text-center">
                                <i class="fa-solid fa-cloud-arrow-up text-4xl text-gray-400"></i>
                                <div class="flex text-sm text-gray-600 justify-center">
                                    <label for="image_file" class="relative cursor-pointer bg-white rounded-md font-medium text-green-600 hover:text-green-500 focus-within:outline-none focus-within:ring-2 focus-within:ring-offset-2 focus-within:ring-green-500">
                                        <span>Upload a file</span>
                                        <input id="image_file" name="image_file" type="file" class="sr-only" accept="image/*">
                                    </label>
                                </div>
                                <p class="text-xs text-gray-500">PNG, JPG, GIF up to 5MB</p>
                            </div>
                        </div>
                    </div>
                    
                    <div class="relative">
                        <div class="absolute inset-0 flex items-center" aria-hidden="true">
                            <div class="w-full border-t border-gray-300"></div>
                        </div>
                        <div class="relative flex justify-center">
                            <span class="px-2 bg-white text-sm text-gray-500">OR</span>
                        </div>
                    </div>
                    
                    <!-- Option 2: Image URL -->
                    <div>
                        <label for="image_url" class="block text-sm font-medium text-gray-700">Image URL</label>
                        <div class="mt-1">
                            <input type="url" name="image_url" id="image_url" value="{{ product.image_url }}" class="shadow-sm focus:ring-green-500 focus:border-green-500 block w-full sm:text-sm border-gray-300 rounded-md py-2 px-3 border" placeholder="https://example.com/image.jpg">
                        </div>
                        <p class="mt-2 text-sm text-gray-500">Provide an external link to the new product image.</p>
                    </div>
                    
                    <div class="pt-4 border-t border-gray-200 flex justify-end">
                        <button type="submit" class="inline-flex justify-center py-2 px-4 border border-transparent shadow-sm text-sm font-medium rounded-md text-white bg-green-600 hover:bg-green-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-green-500">
                            Save Changes
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>

<script>
    // Preview the selected file name
    document.getElementById('image_file').addEventListener('change', function(e) {
        if (e.target.files.length > 0) {
            const fileName = e.target.files[0].name;
            const label = e.target.parentElement.querySelector('span');
            label.textContent = fileName;
        }
    });
</script>
{% endblock %}
