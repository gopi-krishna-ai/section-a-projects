{% extends "base.html" %}

{% block content %}
<div class="max-w-3xl mx-auto py-10 px-4 sm:px-6 lg:px-8">
    <div class="mb-8">
        <a href="{{ url_for('admin_dashboard') }}" class="text-green-600 hover:text-green-800 text-sm font-medium">
            &larr; Back to Dashboard
        </a>
    </div>

    <div class="bg-white shadow sm:rounded-lg">
        <div class="px-4 py-5 border-b border-gray-200 sm:px-6">
            <h3 class="text-lg leading-6 font-medium text-gray-900">
                Add New Product
            </h3>
            <p class="mt-1 max-w-2xl text-sm text-gray-500">
                Upload product details and a real image to expand the catalog.
            </p>
        </div>
        
        <div class="px-4 py-5 sm:p-6">
            <form action="{{ url_for('admin_add_product') }}" method="POST" enctype="multipart/form-data" class="space-y-6">
                
                <div>
                    <label for="name" class="block text-sm font-medium text-gray-700">Product Name</label>
                    <input type="text" name="name" id="name" required class="mt-1 block w-full border border-gray-300 rounded-md shadow-sm py-2 px-3 focus:outline-none focus:ring-green-500 focus:border-green-500 sm:text-sm">
                </div>

                <div>
                    <label for="category" class="block text-sm font-medium text-gray-700">Category</label>
                    <select name="category" id="category" required class="mt-1 block w-full border border-gray-300 rounded-md shadow-sm py-2 px-3 focus:outline-none focus:ring-green-500 focus:border-green-500 sm:text-sm">
                        <option value="Electronics">Electronics</option>
                        <option value="Personal Care">Personal Care</option>
                        <option value="Bags">Bags</option>
                        <option value="Accessories">Accessories</option>
                        <option value="Stationery">Stationery</option>
                        <option value="Kitchen">Kitchen</option>
                        <option value="Home & Decor">Home & Decor</option>
                    </select>
                </div>

                <div class="grid grid-cols-2 gap-6">
                    <div>
                        <label for="price_inr" class="block text-sm font-medium text-gray-700">Price (INR)</label>
                        <div class="mt-1 relative rounded-md shadow-sm">
                            <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                                <span class="text-gray-500 sm:text-sm">₹</span>
                            </div>
                            <input type="number" step="0.01" name="price_inr" id="price_inr" required class="block w-full pl-7 border border-gray-300 rounded-md py-2 focus:ring-green-500 focus:border-green-500 sm:text-sm">
                        </div>
                    </div>

                    <div>
                        <label for="eco_score" class="block text-sm font-medium text-gray-700">Eco Score (0-100)</label>
                        <input type="number" step="0.1" name="eco_score" id="eco_score" required class="mt-1 block w-full border border-gray-300 rounded-md shadow-sm py-2 px-3 focus:outline-none focus:ring-green-500 focus:border-green-500 sm:text-sm">
                    </div>
                </div>

                <div class="grid grid-cols-2 gap-6">
                    <div>
                        <label for="material_type" class="block text-sm font-medium text-gray-700">Material Type</label>
                        <input type="text" name="material_type" id="material_type" placeholder="e.g. Recycled Cotton" class="mt-1 block w-full border border-gray-300 rounded-md shadow-sm py-2 px-3 focus:outline-none focus:ring-green-500 focus:border-green-500 sm:text-sm">
                    </div>
                    
                    <div>
                        <label for="manufacturing_process" class="block text-sm font-medium text-gray-700">Manufacturing Process</label>
                        <input type="text" name="manufacturing_process" id="manufacturing_process" placeholder="e.g. Low Emission" class="mt-1 block w-full border border-gray-300 rounded-md shadow-sm py-2 px-3 focus:outline-none focus:ring-green-500 focus:border-green-500 sm:text-sm">
                    </div>
                </div>

                <div>
                    <label for="description" class="block text-sm font-medium text-gray-700">Description</label>
                    <textarea name="description" id="description" rows="4" class="mt-1 block w-full border border-gray-300 rounded-md shadow-sm py-2 px-3 focus:outline-none focus:ring-green-500 focus:border-green-500 sm:text-sm"></textarea>
                </div>

                <div>
                    <label class="block text-sm font-medium text-gray-700">Product Image</label>
                    <div class="mt-1 flex justify-center px-6 pt-5 pb-6 border-2 border-gray-300 border-dashed rounded-md hover:border-green-400 transition-colors bg-gray-50">
                        <div class="space-y-1 text-center">
                            <i class="fa-solid fa-cloud-arrow-up text-4xl text-gray-400 mb-2"></i>
                            <div class="flex text-sm text-gray-600 justify-center">
                                <label for="image" class="relative cursor-pointer bg-white rounded-md font-medium text-green-600 hover:text-green-500 focus-within:outline-none focus-within:ring-2 focus-within:ring-offset-2 focus-within:ring-green-500 px-2 py-1 border border-gray-200">
                                    <span>Upload a file</span>
                                    <input id="image" name="image" type="file" class="sr-only" accept="image/*" required>
                                </label>
                            </div>
                            <p class="text-xs text-gray-500 mt-2">PNG, JPG, GIF up to 5MB</p>
                        </div>
                    </div>
                </div>

                <div class="pt-5 flex justify-end">
                    <button type="submit" class="inline-flex justify-center py-2 px-4 border border-transparent shadow-sm text-sm font-medium rounded-md text-white bg-green-600 hover:bg-green-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-green-500">
                        Save Product
                    </button>
                </div>

            </form>
        </div>
    </div>
</div>
{% endblock %}
