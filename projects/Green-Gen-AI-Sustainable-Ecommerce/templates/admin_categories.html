{% extends "base.html" %}

{% block content %}
<div class="max-w-7xl mx-auto py-10 px-4 sm:px-6 lg:px-8">
    <div class="md:flex md:items-center md:justify-between mb-8">
        <div class="flex-1 min-w-0">
            <h2 class="text-2xl font-bold leading-7 text-gray-900 sm:text-3xl sm:truncate">
                Manage Category Images
            </h2>
            <p class="mt-1 text-sm text-gray-500">Update the images displayed in the sidebar for each category.</p>
        </div>
        <div class="mt-4 flex md:mt-0 md:ml-4">
            <a href="{{ url_for('admin_dashboard') }}" class="inline-flex items-center px-4 py-2 border border-gray-300 rounded-md shadow-sm text-sm font-medium text-gray-700 bg-white hover:bg-gray-50">
                Back to Dashboard
            </a>
        </div>
    </div>

    <div class="bg-white shadow overflow-hidden sm:rounded-lg">
        <form action="{{ url_for('admin_categories') }}" method="POST">
            <div class="px-4 py-5 sm:p-6">
                <div class="grid grid-cols-1 gap-y-6 gap-x-4 sm:grid-cols-2 lg:grid-cols-3">
                    {% for cat, img_url in cat_images.items() %}
                    <div class="border border-gray-200 rounded-lg p-4 flex flex-col items-center">
                        <label class="block text-sm font-medium text-gray-900 mb-2 w-full text-center">{{ cat }}</label>
                        <div class="relative h-32 w-full rounded-md overflow-hidden mb-3 bg-gray-100">
                            <img src="{{ img_url }}" alt="{{ cat }}" class="absolute inset-0 w-full h-full object-cover">
                        </div>
                        <input type="url" name="cat_{{ cat }}" value="{{ img_url }}" class="shadow-sm focus:ring-green-500 focus:border-green-500 block w-full sm:text-xs border-gray-300 rounded-md py-1 px-2 border" placeholder="https://...">
                    </div>
                    {% endfor %}
                </div>
            </div>
            <div class="px-4 py-3 bg-gray-50 text-right sm:px-6">
                <button type="submit" class="inline-flex justify-center py-2 px-4 border border-transparent shadow-sm text-sm font-medium rounded-md text-white bg-green-600 hover:bg-green-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-green-500">
                    Save All Category Images
                </button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
