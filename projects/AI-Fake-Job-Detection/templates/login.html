<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Fake Job Detection - Login</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <div style="min-height: 100vh; display: flex; align-items: center; justify-content: center;">
        <div style="max-width: 400px; width: 100%; background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(12px); border-radius: 22px; padding: 40px; box-shadow: 0 14px 45px rgba(0,0,0,0.2);">
            <div style="text-align: center; margin-bottom: 20px;">
                <div class="brand-mark" style="margin: 0 auto 15px auto;">AI</div>
                <h2 style="margin: 0; color: #172033;">Welcome Back</h2>
            </div>
            
            <form method="POST" action="{{ url_for('login') }}">
                <div style="margin-bottom: 15px;">
                    <label style="font-weight: bold; color: #697386; margin-bottom: 5px; display: block;">Email address</label>
                    <input type="email" name="email" required placeholder="demo@example.com" style="width: 100%; padding: 12px; border-radius: 12px; border: 1px solid #e5e9f0; box-sizing: border-box; font-family: inherit;">
                </div>
                <div style="margin-bottom: 25px;">
                    <label style="font-weight: bold; color: #697386; margin-bottom: 5px; display: block;">Password</label>
                    <input type="password" name="password" required placeholder="••••••••" style="width: 100%; padding: 12px; border-radius: 12px; border: 1px solid #e5e9f0; box-sizing: border-box; font-family: inherit;">
                </div>
                <button type="submit" class="primary-btn">Login</button>
            </form>
            <div style="text-align: center; margin-top: 15px; font-size: 13px; color: #697386;">
                For this demo, any email/password will work.
            </div>
        </div>
    </div>
</body>
</html>
