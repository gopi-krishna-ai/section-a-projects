<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QR Code Threat Detection</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <div style="min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px;">
        <div style="max-width: 800px; width: 100%; text-align: center; padding: 60px; background: var(--panel-bg); backdrop-filter: blur(15px); border: 1px solid var(--line); border-top: 3px solid var(--primary); border-radius: 16px; box-shadow: 0 20px 50px rgba(0,0,0,0.8);">
            
            <div class="brand-mark" style="margin: 0 auto 30px auto; width: 70px; height: 70px; font-size: 32px;">QR</div>
            <h1 style="font-size: 3.5rem; margin-top: 0; margin-bottom: 20px; font-weight: 900; color: #fff; text-shadow: 0 0 20px var(--primary-dim);">THREAT DETECTOR</h1>
            
            <p style="font-size: 1.2rem; margin-bottom: 40px; color: var(--muted); line-height: 1.8; font-family: monospace;">
                [ SYSTEM INITIALIZED ]<br><br>
                Upload a QR code or paste a URL to instantly detect phishing attempts, malicious redirects, and fraudulent payment gateways using Machine Learning.
                <br><br>
                > DECODE QR CONTENTS<br>
                > ANALYZE URL RISK FACTORS<br>
                > PLOT LOCAL THREATS ON MAP
            </p>

            <a href="{{ url_for('login') }}" class="primary-btn" style="display: inline-block; width: auto; padding: 18px 50px; text-decoration: none;">INITIALIZE SCANNER</a>
            
        </div>
    </div>
</body>
</html>
