{% extends "base.html" %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6 col-lg-4">
        <div class="card glass-panel mt-5">
            <div class="card-header text-center">
                <h4 class="mb-0">Two-Factor Authentication</h4>
            </div>
            <div class="card-body text-center">
                <i class="fas fa-mobile-alt fa-3x text-info mb-3"></i>
                <p class="mb-4">Please enter the 6-digit OTP generated for your account.</p>
                
                <form method="POST">
                    <div class="mb-3">
                        <input type="text" class="form-control text-center fs-4 letter-spacing-2" name="otp" placeholder="------" maxlength="6" required autofocus>
                    </div>
                    <button type="submit" class="btn btn-primary w-100">
                        <i class="fas fa-check-circle me-2"></i>Verify OTP
                    </button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
