<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AgriMitra AI - Login</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='css/theme.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/login.css') }}">

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>

<body>

<div class="overlay">

    <div class="login-card">

        <img src="{{ url_for('static', filename='images/logo.png') }}" class="logo" alt="AgriMitra AI Logo">

        <h1 id="title">AgriMitra AI</h1>

        <p class="tagline" id="tagline">
            Multilingual Smart Farming Assistant
        </p>

        <div class="language-box">

            <i class="fa-solid fa-globe"></i>

            <select id="language">

                <option value="en">English</option>

                <option value="kn">ಕನ್ನಡ</option>

                <option value="hi">हिन्दी</option>

                <option value="te">తెలుగు</option>

                <option value="ta">தமிழ்</option>

            </select>

        </div>

        <div class="input-box">

            <i class="fa-solid fa-user"></i>

            <input
            type="text"
            id="userid"
            placeholder="Enter User ID"
            autocomplete="username">

        </div>

        <div class="input-box">

            <i class="fa-solid fa-lock"></i>

            <input
            type="password"
            id="password"
            placeholder="Enter Password"
            autocomplete="current-password">

            <i class="fa-solid fa-eye" id="eye"></i>

        </div>

        <div id="error" role="alert" aria-live="polite"></div>

        
        <div style="display: flex; flex-direction: column; gap: 15px; margin-top: 15px;">
            <button id="loginBtn" onclick="login()" aria-label="Log in as User">
                <i class="fa-solid fa-user"></i> LOGIN AS USER
            </button>
            <button type="button" id="adminLoginBtn" onclick="window.location.href='/admin/login'" aria-label="Log in as Admin" style="background: linear-gradient(135deg, #1e293b, #0f172a); border: 1px solid rgba(255,255,255,0.1); box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);">
                <i class="fa-solid fa-shield-halved"></i> LOGIN AS ADMIN
            </button>
        </div>


        <div class="links">

            <a href="#" id="forgot">Forgot Password?</a>

            <a href="/register" id="register">Register</a>

        </div>

    </div>

</div>

<script src="{{ url_for('static', filename='js/login.js') }}"></script>

</body>

</html>
